services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nimc_user
      POSTGRES_PASSWORD: nimc_password
      POSTGRES_DB: nimc_db
    volumes:
      - ./database/db-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
  backend:
    build: ./backend
    environment:
      POSTGRES_USER: nimc_user
      POSTGRES_PASSWORD: nimc_password
      POSTGRES_DB: nimc_db
      POSTGRES_HOST: db
    ports:
      - "5000:5000"
    depends_on:
      - db
  frontend:
    build: ./frontend
      - "4000:3000"
    environment:
     REACT_APP_API_URL: http://backend:5050
    depends_on:
      - backend